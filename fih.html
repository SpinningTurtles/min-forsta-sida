<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swimming Fish</title>
<style>
  :root{
    --deep: #062f3a;
    --mid: #0a4a5c;
    --shallow: #17879e;
    --sun: #bdf1ff;
    --fish-body: #ff8a4c;
    --fish-belly: #ffd39b;
    --fish-dark: #d9612a;
  }
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background: radial-gradient(120% 100% at 50% 0%, var(--sun), var(--shallow) 40%, var(--mid) 70%, var(--deep) 100%);
    font-family: system-ui, sans-serif;
  }
  .ocean{
    position:relative;
    width:100%;
    height:100vh;
  }
  .ray{
    position:absolute;
    top:-10%;
    width:6%;
    height:70%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.25), rgba(255,255,255,0));
    transform-origin: top center;
    filter: blur(2px);
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: rotate(4deg); }
    50% { transform: rotate(-4deg); }
  }

  .bubble{
    position:absolute;
    bottom:-5%;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity:0.8; }
    100% { transform: translateY(-110vh) translateX(20px); opacity:0; }
  }

  .weed{
    position:absolute;
    bottom:0;
    width:16px;
    height:140px;
    background: linear-gradient(to top, #0b5d3a, #147a4a);
    border-radius: 50% 50% 0 0 / 20% 20% 0 0;
    transform-origin: bottom center;
    animation: weedsway 4s ease-in-out infinite;
    opacity:0.85;
  }
  @keyframes weedsway {
    0%,100% { transform: rotate(6deg); }
    50% { transform: rotate(-6deg); }
  }

  /* Fish now face RIGHT (head/eye on the right, tail on the left),
     matching the direction they swim across the screen. */
  .fish-wrap{
    position:absolute;
    top:40%;
    left:-200px;
    animation: swim 12s linear infinite;
  }
  @keyframes swim {
    0%   { left: -200px; }
    100% { left: 110%; }
  }
  @keyframes swim-reverse {
    0%   { left: 110%; }
    100% { left: -200px; }
  }

  .fish{
    position:relative;
    width:120px;
    height:70px;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  .fish svg{
    width:100%;
    height:100%;
    overflow:visible;
  }

  .tail{
    transform-origin: 22px 35px;
    animation: wag 0.5s ease-in-out infinite;
  }
  @keyframes wag {
    0%,100% { transform: rotate(-18deg); }
    50% { transform: rotate(18deg); }
  }

  .fin-top{
    transform-origin: 50px 14px;
    animation: finwag 0.6s ease-in-out infinite;
  }
  .fin-bottom{
    transform-origin: 50px 56px;
    animation: finwag 0.6s ease-in-out infinite;
  }
  @keyframes finwag {
    0%,100% { transform: rotate(6deg); }
    50% { transform: rotate(-6deg); }
  }

  /* Fish 2 swims right-to-left: flip its artwork to face left,
     and give it the reverse motion path so it actually travels
     that way instead of just looking mirrored. */
  .fish-wrap.two{
    top:65%;
    animation-name: swim-reverse;
    animation-duration: 18s;
    animation-delay: -4s;
    transform: scaleX(-1) scale(0.6);
  }
  .fish-wrap.two .fish{
    animation-duration: 1.8s;
  }

  .fish-wrap.three{
    top:22%;
    animation-duration: 15s;
    animation-delay: -9s;
    transform: scale(0.4);
    opacity:0.7;
  }

  .caption{
    position:absolute;
    bottom:18px;
    width:100%;
    text-align:center;
    color: rgba(255,255,255,0.85);
    letter-spacing:0.08em;
    font-size:13px;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="ocean" id="ocean">

  <a href="index.html">Main Site.</a>

  <!-- Fish 1: head/eye on right, tail on left -->
  <div class="fish-wrap">
    <div class="fish">
      <svg viewBox="0 0 120 70">
        <g class="tail">
          <path d="M22,35 L0,15 L10,35 L0,55 Z" fill="var(--fish-dark)"/>
        </g>
        <ellipse cx="62" cy="35" rx="42" ry="22" fill="var(--fish-body)"/>
        <path d="M35,48 Q62,54 89,48 Q62,51 35,48 Z" fill="var(--fish-belly)"/>
        <g class="fin-top">
          <path d="M50,14 Q65,-4 77,12 Q63,10 50,14 Z" fill="var(--fish-dark)"/>
        </g>
        <g class="fin-bottom">
          <path d="M50,56 Q63,72 73,58 Q61,58 50,56 Z" fill="var(--fish-dark)"/>
        </g>
        <circle cx="95" cy="30" r="5" fill="#ffffff"/>
        <circle cx="97" cy="30" r="2.4" fill="#1a1a1a"/>
        <path d="M98,37 Q85,42 72,37" stroke="var(--fish-dark)" stroke-width="2" fill="none" opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- Fish 2 -->
  <div class="fish-wrap two">
    <div class="fish">
      <svg viewBox="0 0 120 70">
        <g class="tail">
          <path d="M22,35 L0,15 L10,35 L0,55 Z" fill="#2b7d8a"/>
        </g>
        <ellipse cx="62" cy="35" rx="42" ry="22" fill="#3fb6c9"/>
        <path d="M35,48 Q62,54 89,48 Q62,51 35,48 Z" fill="#c9f3f8"/>
        <g class="fin-top">
          <path d="M50,14 Q65,-4 77,12 Q63,10 50,14 Z" fill="#2b7d8a"/>
        </g>
        <g class="fin-bottom">
          <path d="M50,56 Q63,72 73,58 Q61,58 50,56 Z" fill="#2b7d8a"/>
        </g>
        <circle cx="95" cy="30" r="5" fill="#ffffff"/>
        <circle cx="97" cy="30" r="2.4" fill="#1a1a1a"/>
      </svg>
    </div>
  </div>

  <!-- Fish 3 (tiny background) -->
  <div class="fish-wrap three">
    <div class="fish">
      <svg viewBox="0 0 120 70">
        <g class="tail">
          <path d="M22,35 L0,15 L10,35 L0,55 Z" fill="#e0a35a"/>
        </g>
        <ellipse cx="62" cy="35" rx="42" ry="22" fill="#f4c98a"/>
        <circle cx="95" cy="30" r="5" fill="#ffffff"/>
        <circle cx="97" cy="30" r="2.4" fill="#1a1a1a"/>
      </svg>
    </div>
  </div>

</div>

<script>
  const ocean = document.getElementById('ocean');

  for (let i = 0; i < 5; i++) {
    const ray = document.createElement('div');
    ray.className = 'ray';
    ray.style.left = (10 + i * 20) + '%';
    ray.style.animationDelay = (i * 1.3) + 's';
    ocean.appendChild(ray);
  }

  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 4 + Math.random() * 10;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (5 + Math.random() * 8) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    ocean.appendChild(b);
  }

  for (let i = 0; i < 7; i++) {
    const w = document.createElement('div');
    w.className = 'weed';
    w.style.left = (5 + i * 14 + Math.random() * 6) + '%';
    w.style.height = (80 + Math.random() * 90) + 'px';
    w.style.animationDelay = (Math.random() * 4) + 's';
    w.style.animationDuration = (3 + Math.random() * 3) + 's';
    ocean.appendChild(w);
  }
</script>
</body>
</html>

</body>
</html>
